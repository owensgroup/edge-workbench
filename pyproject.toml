[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "edge-workbench"
version = "0.1.0"
description = "Execute, verify and explore EDGE algorithm specifications"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Sanjana Mali" }]

# Deliberately empty. The page is a self-contained HTML file that replays
# edge-core-ir's evaluator trace (found via EDGE_IR_REPO or a sibling
# checkout), so nothing here needs numpy to draw a page. A verifier of KIND
# "library" may import networkx/scipy/numpy; without them installed it fails
# with an "install X" message rather than disabling the tool.
dependencies = []

[project.optional-dependencies]
# Oracles. scipy.sparse.csgraph alone covers BFS, DFS, Dijkstra, Bellman-Ford,
# Floyd-Warshall, max-flow and connected components -- most of the zoo.
oracles = ["scipy>=1.11", "networkx>=3.0"]
dev = ["pytest>=7"]

[tool.setuptools.packages.find]
include = ["edge_workbench*"]
